<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="galeria.css">
    <title>Minha Galeria Multimídia</title>
</head>
<body>
    <div class="container">
        <h1>Minha Galeria </h1>
        <section class="gallery" aria-label="Galeria de imagens, vídeos e áudios">
            <figure class="media-card image-card">
                <img src="fotoshaco1.jpg"malt="Foto 1">
                <figcaption><strong>Foto 1</strong>Primeira imagem.</figcaption>
            </figure>
            <figure class="media-card image-card">
                <img src="fotoshaco2.jpg" alt="Foto 2">
                <figcaption>
                    <strong>Foto 2</strong>
                    segunda imagem.
                </figcaption>
            </figure>
            <figure class="media-card video-card video_1">
                <iframe
                    src="https://www.youtube.com/embed/QdBZY2fkU-0"
                    title="Vídeo 1"
                    allowfullscreen>
                </iframe>
                <figcaption>
                    <strong>Video 1</strong>
                    Primeiro video-Trailer01 GTA6.
                </figcaption>
            </figure>
            <figure class="media-card video-card video_2">
                <iframe
                    src="https://www.youtube.com/embed/cv041_93_0Q"
                    title="Vídeo 2"
                    allowfullscreen>
                </iframe>
                <figcaption>
                    <strong>Video 2</strong>
                    Segundo video-Trailer01 GTA6.
                </figcaption>
            </figure>
            <figure class="media-card audio-card audio_1">
                <iframe
                    src="https://open.spotify.com/embed/track/1UNEuG9DYOWiikf00ayr52"
                    title="Música 1"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
                <figcaption>
                    <strong>Áudio 01</strong>
                    Primeira música da galeria.
                </figcaption>
            </figure>
            <figure class="media-card audio-card audio_2">
                <iframe
                    src="https://open.spotify.com/embed/track/5GpfyJrKHJI36jDKtQiyGN"
                    title="Música 2"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
                <figcaption>
                    <strong>Áudio 02</strong>
                    Segunda música da galeria.
                </figcaption>
            </figure>
        </section>
      </div>
    <footer class="footer">
        <p>&copy; 2026 Galeria Multimídia</p>
        <p>Desenvolvido por Douglas Alencar</p>
    </footer>
</body>
</html>
